name: Apply APKbox platform migration

on:
  push:
    branches:
      - feature/screen-agent
    paths:
      - scripts/apply_platform_migration.py
      - .github/workflows/platform-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/screen-agent
          fetch-depth: 0
      - name: Apply guarded migration
        run: python3 scripts/apply_platform_migration.py
      - name: Commit migrated sources
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/mekromn/apkbox
          git commit -m "Wire universal jobs inventory and APK retrieval"
          git push origin HEAD:feature/screen-agent
