name: Build APKbox

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apkbox-${{ github.ref }}
  cancel-in-progress: true

env:
  APKBOX_KEYSTORE: /home/runner/.apkbox-signing/debug.keystore

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # The signing private key stays only in the Actions cache. This workflow intentionally does
      # not run for pull_request events, so untrusted PR code never receives the cached key.
      - name: Restore APKbox development signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.apkbox-signing/debug.keystore
          key: apkbox-development-signing-v2

      - name: Ensure APKbox development signing key
        shell: bash
        run: |
          mkdir -p "$(dirname "$APKBOX_KEYSTORE")"
          if [ ! -f "$APKBOX_KEYSTORE" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$APKBOX_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=APKbox Development,O=mekromn,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Show APKbox signing certificate
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$APKBOX_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA256:'

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APKbox debug APK
        uses: actions/upload-artifact@v4
        with:
          name: APKbox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
