name: Build APKbox

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apkbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # A fresh GitHub runner would otherwise create a new debug key. Keeping this cache private
      # to trusted main/workflow_dispatch builds makes APKbox updates install over prior APKbox
      # builds without committing a signing private key to this public repository.
      - name: Restore APKbox development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: apkbox-development-signing-v1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APKbox debug APK
        uses: actions/upload-artifact@v4
        with:
          name: APKbox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
